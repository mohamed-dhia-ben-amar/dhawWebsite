@let on = sound.enabled();
<button
  type="button"
  class="toggle"
  data-sound="off"
  [attr.aria-label]="label()"
  [attr.aria-pressed]="on"
  [title]="label()"
  (click)="toggle()"
>
  <svg class="toggle__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    <path d="M11 5 6 9H2v6h4l5 4V5Z" />
    @if (on) {
      <path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14" />
    } @else {
      <path d="m22 9-6 6M16 9l6 6" />
    }
  </svg>
</button>
