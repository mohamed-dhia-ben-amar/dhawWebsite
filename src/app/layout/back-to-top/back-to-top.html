@if (visible()) {
  <button
    type="button"
    class="to-top"
    [attr.aria-label]="label()"
    [attr.title]="label()"
    [style.--footer-overlap]="footerOverlap() + 'px'"
    (click)="scrollToTop()"
  >
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
      <path
        d="M12 19V5M5 12l7-7 7 7"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </button>
}
