<header class="header">
  <div class="header__inner container">
    <a id="site-logo" class="header__logo" routerLink="/">
      {{ content.logo.text }}<span class="header__prompt">{{ content.logo.prompt }}</span>
      <span class="visually-hidden"> {{ content.logo.srSuffix }}</span>
    </a>
    <nav class="nav" [attr.aria-label]="content.nav.label">
      <ul class="nav__list" role="list">
        @for (link of content.nav.links; track link.fragment) {
          @let current = active() === link.fragment;
          <li class="nav__item">
            <a
              class="nav__link"
              [class.nav__link--active]="current"
              routerLink="/"
              [fragment]="link.fragment"
              [attr.aria-current]="current ? 'true' : null"
            >
              <span class="nav__icon"><app-nav-icon [name]="link.icon" /></span>
              <span class="nav__label">{{ link.label }}</span>
            </a>
          </li>
        }
      </ul>
    </nav>
    <app-language-switch
      class="header__langs"
      [options]="content.languages.options"
      [current]="locale"
      [label]="content.languages.label"
      [path]="path()"
    />
  </div>
</header>
