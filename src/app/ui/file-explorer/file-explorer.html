<div class="explorer">
  <p class="explorer__heading" aria-hidden="true">{{ heading() }}</p>
  <div
    class="explorer__files"
    role="tablist"
    [attr.aria-label]="label()"
    [attr.aria-orientation]="orientation()"
  >
    @for (file of files(); track file) {
      @let selected = file === active();
      <button
        #tab
        type="button"
        role="tab"
        class="explorer__file"
        [class.explorer__file--active]="selected"
        [id]="tabId(idPrefix(), file)"
        [attr.aria-controls]="panelId(idPrefix(), file)"
        [attr.aria-selected]="selected"
        [attr.tabindex]="selected ? 0 : -1"
        (click)="select(file)"
        (keydown)="onKeydown($event)"
      >
        <span class="explorer__icon" aria-hidden="true">{{ '{}' }}</span
        >{{ file }}
      </button>
    }
  </div>
</div>
