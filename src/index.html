<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mohamed Dhia Ben Amar · Full-Stack Software Engineer</title>
    <meta
      name="description"
      content="Full-stack engineer in Tunis building configurable Angular widget libraries and AI-assisted workflows. Open to EU remote and hybrid roles."
    />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0e1a2b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f6f9" media="(prefers-color-scheme: light)" />
    <script>
      // Theme picked with the header toggle (src/app/core/theme.ts), applied before first paint.
      try {
        var theme = localStorage.getItem('theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme;
          var color = theme === 'light' ? '#f4f6f9' : '#0e1a2b';
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
            meta.setAttribute('content', color);
          });
        }
      } catch (e) {}
    </script>
    <link
      rel="preload"
      href="/fonts/instrument-sans-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/martian-mono-latin-standard-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
